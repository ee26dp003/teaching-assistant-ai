<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI & ML Teaching Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="notebook">
      <div class="spiral" aria-hidden="true"></div>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle chalkboard mode">
        <span class="theme-toggle-icon" aria-hidden="true">✏️</span>
        <span class="theme-toggle-label">Chalkboard</span>
      </button>

      <main class="notebook-page">
        <header class="app-header">
          <h1>Ask about AI &amp; Machine Learning</h1>
          <p class="subtitle">Get a clear, step-by-step explanation — with the math shown, not just the idea.</p>
        </header>

        <section class="ask-section">
          <label for="question-input">Your question</label>
          <textarea
            id="question-input"
            placeholder="e.g. Explain gradient descent using a simple analogy."
            rows="3"
          ></textarea>

          <button id="ask-button" class="ask-button" type="button">Ask Question</button>

          <p id="validation-message" class="message error hidden"></p>
        </section>

        <section class="answer-section">
          <h2>Answer</h2>

          <div id="status-area" class="status hidden">
            <span class="spinner" aria-hidden="true"></span>
            <span id="status-text">Thinking...</span>
          </div>

          <div id="answer-box" class="answer-box">
            <p class="placeholder">Your answer will appear here.</p>
          </div>

          <p id="error-message" class="message error hidden"></p>
        </section>

        <footer class="app-footer">
          <p>Educational prototype — answers are AI-generated and may be incomplete or incorrect.</p>
        </footer>
      </main>
    </div>
  </div>

  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
